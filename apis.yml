apis:
- aid: aro-biotherapeutics:site-mcp
  name: Aro Biotherapeutics Site MCP
  description: >-
    A live, anonymously reachable Model Context Protocol endpoint served from Aro Biotherapeutics'
    own host and advertised in the site's llms.txt. It is provided by the Wix platform, not built
    by Aro — it exposes generic Wix site tools (business details, site search, site API docs
    search, visitor-token issuance and a Wix REST API call/execute bridge) over the public content
    of www.arobiotx.com. A tools/list call returns 9 tools with real JSON Schema inputs. There is
    no Aro-authored API behind it.
  humanURL: https://www.arobiotx.com/
