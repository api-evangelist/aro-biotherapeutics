aid: aro-biotherapeutics
name: Aro Biotherapeutics
description: >-
  Aro Biotherapeutics is a Philadelphia-based biotechnology company developing tissue-targeted
  genetic medicines built on Centyrins, a proprietary engineered human protein scaffold that is
  small, stable and highly soluble. Aro conjugates Centyrins to oligonucleotide payloads
  (Centyrin-siRNA conjugates) to deliver RNA- and DNA-based therapeutics precisely to cells and
  tissues outside the liver, including muscle and immune cells. Its lead program, ABX1100, is a
  CD71-targeted Centyrin-siRNA conjugate for Pompe disease that has received FDA orphan drug
  designation. The company is privately held, raised a $41.5M Series B led by Cowen Healthcare
  Investments with participation from Johnson & Johnson Innovation, and is headquartered at 601
  Walnut Street, Philadelphia, PA. Aro publishes no developer program, API reference or SDK; the
  only machine-readable surface on its domain is the Wix-platform llms.txt and Site MCP endpoint.
